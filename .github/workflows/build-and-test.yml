name: build-and-test

# Push-triggered pipeline. Never touches the tailnet: the test ISO carries a
# dummy tailscale key (verified to keep retrying), and the release ISO is
# booted with guest networking restricted so its baked key cannot fire.
# Real tailscale connectivity is a separate, manually-dispatched workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache pristine Ubuntu ISO
        uses: actions/cache@v4
        with:
          path: iso
          key: ubuntu-2604-live-server-amd64-v1

      - name: Fetch inputs (ISO, authorized keys, deb bundle)
        run: python3 scripts/ci/fetch_inputs.py

      - name: Generate per-run test SSH key
        run: ssh-keygen -t ed25519 -N '' -C lisa-ci-test -f test_key -q

      - name: Install xorriso
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xorriso

      - name: Render seeds and build both ISOs
        env:
          # Consumed only by the release (final) render. On the public repo
          # these are dummies; artifacts stay credential-free there.
          TS_AUTHKEY_RELEASE: ${{ secrets.TS_AUTHKEY_RELEASE }}
          EDUROAM_USERNAME: ${{ secrets.EDUROAM_USERNAME }}
          EDUROAM_PASSWORD: ${{ secrets.EDUROAM_PASSWORD }}
        run: |
          # Test ISO: dummy tailscale key + code-generated dummy eduroam
          # credentials — no secrets involved at all.
          TS_AUTHKEY="tskey-dummy-injected-at-test-time" python3 scripts/render_seed.py --variant test --out seed-test
          TS_AUTHKEY="$TS_AUTHKEY_RELEASE" python3 scripts/render_seed.py --variant final --out seed-final
          python3 scripts/build_iso.py test  seed-test  lisa-test.iso
          python3 scripts/build_iso.py final seed-final lisa-final.iso

      - name: Upload test ISO
        uses: actions/upload-artifact@v4
        with:
          name: lisa-test-iso
          path: lisa-test.iso
          retention-days: 1
          compression-level: 0

      - name: Upload release ISO
        uses: actions/upload-artifact@v4
        with:
          name: lisa-final-iso
          path: |
            lisa-final.iso
            lisa-final.iso.sha256
          retention-days: 5
          compression-level: 0

      - name: Upload per-run test key
        uses: actions/upload-artifact@v4
        with:
          name: test-ssh-key
          path: |
            test_key
            test_key.pub
          retention-days: 1

  test-install:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install QEMU + OVMF
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 ovmf

      - uses: actions/download-artifact@v4
        with:
          name: lisa-test-iso
      - uses: actions/download-artifact@v4
        with:
          name: test-ssh-key
      - run: chmod 600 test_key

      - name: Unattended install (phase 1)
        run: python3 scripts/ci/vm.py install lisa-test.iso

      - name: First boot (phase 2)
        run: python3 scripts/ci/vm.py boot

      - name: Verify installed system (in-guest)
        run: python3 scripts/ci/run_verify.py

      - name: eduroam WPA2-Enterprise handshake test (in-guest, detached)
        run: python3 scripts/ci/run_hwsim_detached.py

      - name: Stop VM
        if: always()
        run: python3 scripts/ci/vm.py stop

      - name: Upload serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-logs-test-install
          path: serial-*.log
          retention-days: 1

  test-final:
    needs: [build, test-install]
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU + OVMF
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 ovmf

      - uses: actions/download-artifact@v4
        with:
          name: lisa-final-iso
      - uses: actions/download-artifact@v4
        with:
          name: test-ssh-key
      - run: chmod 600 test_key

      - name: Unattended install (phase 1)
        run: python3 scripts/ci/vm.py install lisa-final.iso

      - name: First boot (phase 2, guest networking restricted)
        # restrict=on so the release image's baked tailscale key cannot fire
        # from CI; real connectivity is the manually-dispatched workflow.
        run: python3 scripts/ci/vm.py boot --restrict

      - name: Assert only de0ch.keys can log in (test key + password rejected)
        run: python3 scripts/ci/assert_ssh_locked.py

      - name: Stop VM
        if: always()
        run: python3 scripts/ci/vm.py stop

      - name: Upload serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-logs-test-final
          path: serial-*.log
          retention-days: 1
