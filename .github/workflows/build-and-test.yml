name: build-and-test

on:
  push:
    branches: [main]
  workflow_dispatch:

# Test jobs create real (ephemeral) nodes named lisa* on the tailnet;
# never let two runs race each other.
concurrency:
  group: tailnet-tests
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache pristine Ubuntu ISO
        uses: actions/cache@v4
        with:
          path: iso
          key: ubuntu-2604-live-server-amd64-v1

      - name: Fetch inputs (ISO, authorized keys, deb bundle)
        run: python3 scripts/ci/fetch_inputs.py

      - name: Generate per-run test SSH key
        run: ssh-keygen -t ed25519 -N '' -C lisa-ci-test -f test_key -q

      - name: Install xorriso
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xorriso

      - name: Render seeds and build both ISOs
        env:
          PASSWORD_HASH: ${{ secrets.CONSOLE_PASSWORD_HASH }}
          EDUROAM_IDENTITY: ${{ secrets.EDUROAM_IDENTITY }}
          EDUROAM_PASSWORD: ${{ secrets.EDUROAM_PASSWORD }}
          TS_AUTHKEY_FINAL: ${{ secrets.TS_AUTHKEY_FINAL }}
        run: |
          # Test ISO always gets a dummy key: the real CI test key is injected
          # over SSH at test time and never lands in an artifact.
          TS_AUTHKEY="tskey-dummy-injected-at-test-time" python3 scripts/render_seed.py --variant test --out seed-test
          TS_AUTHKEY="$TS_AUTHKEY_FINAL" python3 scripts/render_seed.py --variant final --out seed-final
          python3 scripts/build_iso.py test  seed-test  lisa-test.iso
          python3 scripts/build_iso.py final seed-final lisa-final.iso

      - name: Upload test ISO
        uses: actions/upload-artifact@v4
        with:
          name: lisa-test-iso
          path: lisa-test.iso
          retention-days: 1
          compression-level: 0

      - name: Upload final ISO
        uses: actions/upload-artifact@v4
        with:
          name: lisa-final-iso
          path: |
            lisa-final.iso
            lisa-final.iso.sha256
          retention-days: 5
          compression-level: 0

      - name: Upload per-run test key
        uses: actions/upload-artifact@v4
        with:
          name: test-ssh-key
          path: |
            test_key
            test_key.pub
          retention-days: 1

  test-install:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install QEMU + OVMF
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 ovmf

      - uses: actions/download-artifact@v4
        with:
          name: lisa-test-iso
      - uses: actions/download-artifact@v4
        with:
          name: test-ssh-key
      - run: chmod 600 test_key

      - name: Unattended install (phase 1)
        run: python3 scripts/ci/vm.py install lisa-test.iso

      - name: First boot (phase 2)
        run: python3 scripts/ci/vm.py boot

      - name: Inject CI tailscale key (never baked into artifacts)
        env:
          CONSOLE_PASSWORD: ${{ secrets.CONSOLE_PASSWORD }}
          TS_AUTHKEY_TEST: ${{ secrets.TS_AUTHKEY_TEST }}
        run: python3 scripts/ci/inject_tskey.py

      - name: Verify installed system (in-guest)
        env:
          CONSOLE_PASSWORD: ${{ secrets.CONSOLE_PASSWORD }}
          TS_AUTHKEY_TEST: ${{ secrets.TS_AUTHKEY_TEST }}
        run: python3 scripts/ci/run_verify.py

      - name: eduroam WPA2-Enterprise handshake test (in-guest, detached)
        env:
          CONSOLE_PASSWORD: ${{ secrets.CONSOLE_PASSWORD }}
          EDUROAM_IDENTITY: ${{ secrets.EDUROAM_IDENTITY }}
          EDUROAM_PASSWORD: ${{ secrets.EDUROAM_PASSWORD }}
        run: python3 scripts/ci/run_hwsim_detached.py

      - name: Stop VM
        if: always()
        run: python3 scripts/ci/vm.py stop

      - name: Upload serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-logs-test-install
          path: serial-*.log
          retention-days: 1

  test-final:
    # Serialized after test-install so the ephemeral test node has released
    # the "lisa" name before the final image joins.
    needs: [build, test-install]
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU + OVMF
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 ovmf

      - uses: actions/download-artifact@v4
        with:
          name: lisa-final-iso
      - uses: actions/download-artifact@v4
        with:
          name: test-ssh-key
      - run: chmod 600 test_key

      - name: Record run start (for tailnet device filtering)
        run: echo "SINCE=$(date +%s)" >> "$GITHUB_ENV"

      - name: Unattended install (phase 1)
        run: python3 scripts/ci/vm.py install lisa-final.iso

      - name: First boot (phase 2)
        run: python3 scripts/ci/vm.py boot

      - name: Assert only de0ch.keys can log in (test key + password rejected)
        run: python3 scripts/ci/assert_ssh_locked.py

      - name: Verify tailnet join via Tailscale API
        env:
          TS_API_TOKEN: ${{ secrets.TS_API_TOKEN }}
        run: python3 scripts/ci/tailscale_api.py wait-join "$SINCE"

      - name: Clean up CI tailnet node(s)
        if: always()
        env:
          TS_API_TOKEN: ${{ secrets.TS_API_TOKEN }}
        run: python3 scripts/ci/tailscale_api.py cleanup "$SINCE"

      - name: Stop VM
        if: always()
        run: python3 scripts/ci/vm.py stop

      - name: Upload serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-logs-test-final
          path: serial-*.log
          retention-days: 1
